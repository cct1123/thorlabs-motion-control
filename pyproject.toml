[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "k10cr2-controller"
version = "0.1.0"
description = "Small synchronous Thorlabs K10CR2 controller over WinUSB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyusb>=1.3.1,<2", "libusb-package>=1.0.30,<2"]

[project.optional-dependencies]
gui = ["dash>=3.0,<4"]

[project.scripts]
k10cr2 = "k10cr2.cli:main"
k10cr2-gui = "k10cr2.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k10cr2"]

[tool.hatch.build.targets.wheel.force-include]
"docs/hardware/K10CR2-user-guide-ETN064249-D02.pdf" = "k10cr2/manuals/K10CR2-user-guide-ETN064249-D02.pdf"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

